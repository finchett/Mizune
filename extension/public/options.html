<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mizune settings</title>
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="previews.css">
<link rel="stylesheet" href="scene.css">
<style>
  /* The app's settings screen (SettingsScreen.kt), on the design the extension's pages share */
  html, body { height: 100%; }
  body { display: flex; }

  /* the sidebar: the panes, and Mizune's name and version at its foot */
  .sidebar { width: 216px; flex: none; display: flex; flex-direction: column; background: var(--surfaceVariant); }
  /* no window buttons to make room for, so the title lines up with the panes' names */
  .sidebar .head { height: 40px; flex: none; display: flex; align-items: center; padding-left: 20px; font-size: 14px; line-height: 20px; font-weight: 500; }
  .sidebar nav { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 0 10px; }
  .nav { position: relative; text-align: left; padding: 7px 10px; border-radius: 8px; font-size: 13px; line-height: 19px; transition: color 200ms var(--ease), background-color 150ms var(--ease); }
  .nav:not(.on):hover { background: color-mix(in srgb, var(--onSurface) 5%, transparent); }
  .nav.on { color: var(--primary); font-weight: 500; }
  /* the open pane's highlight, gliding from one to the next */
  .sidebar .pill { position: absolute; top: 0; left: 10px; right: 10px; border-radius: 8px; background: color-mix(in srgb, var(--primary) 13%, transparent); transition: transform 300ms cubic-bezier(0.3, 1.15, 0.5, 1), height 300ms var(--ease), opacity 200ms var(--ease); }
  .sidebar .pill.away { opacity: 0; }
  .sidebar .grow { flex: 1; }
  .sidebar .foot { border-top: 1px solid var(--hairline); padding: 6px; }
  /* Mizune's name and version open About, lit like a pane while it's open, as in the app */
  .sidebar .about { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; text-align: left; transition: background-color 200ms var(--ease); }
  .sidebar .about:hover { background: color-mix(in srgb, var(--onSurface) 5%, transparent); }
  .sidebar .about.on { background: color-mix(in srgb, var(--primary) 13%, transparent); }
  .sidebar .about.on .name { color: var(--primary); }
  .sidebar .foot img { width: 32px; height: 32px; margin: 4px; }
  .sidebar .foot .name { font-size: 13px; line-height: 18px; font-weight: 500; }
  .sidebar .foot .version { font-size: 12px; line-height: 17px; color: var(--onSurfaceVariant); }

  /* the open pane: its name over it, then its sections */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .main > header .pane-title { animation: title-in 260ms var(--ease) both; }
  @keyframes title-in { from { opacity: 0; transform: translateX(-6px); } }
  .main > header { height: 40px; flex: none; display: flex; align-items: center; padding-left: 32px; font-size: 15px; line-height: 20px; font-weight: 500; border-bottom: 1px solid var(--hairline); }
  .scroll { flex: 1; overflow-y: auto; }
  /* the pane, and beside it, while there's room, how its settings look */
  .columns { display: flex; align-items: flex-start; gap: 40px; padding: 24px 32px 40px; }
  .content { flex: 1 1 560px; max-width: 620px; min-width: 0; display: flex; flex-direction: column; gap: 26px; }
  /* while there's room, a pane of its own at the right showing how the open pane's settings look:
     the sidebar's colour, so the settings sit between the two */
  .preview-pane { flex: 1 1 400px; min-width: 340px; display: flex; flex-direction: column; background: var(--surfaceVariant); border-left: 1px solid var(--hairline); }
  .preview-pane:has(#preview:empty) { display: none; }
  .preview-pane > header { height: 40px; flex: none; display: flex; align-items: center; padding-left: 24px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--onSurfaceVariant); border-bottom: 1px solid var(--hairline); }
  .preview-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; }
  /* in the middle of the pane, both ways, while it fits */
  .preview-column { margin: auto; width: 100%; max-width: 540px; padding: 32px 28px; display: flex; flex-direction: column; gap: 28px; }
  /* beside it, the settings keep to their own width */
  body:has(#preview:not(:empty)) .main { flex: 0 1 700px; }
  .preview-column.entering > * { animation: section-in 420ms var(--ease) 80ms backwards; }
  @media (max-width: 1179px) { .preview-pane { display: none; } body:has(#preview:not(:empty)) .main { flex: 1; } }
  /* the subtitles' preview under the size is the column's job while it's there */
  @media (min-width: 1180px) { .content .preview { display: none; } }

  /* About: the app's icon and name, the ways out, and its thanks */
  .about-hero { display: flex; align-items: center; gap: 18px; }
  .about-hero img { width: 84px; height: 84px; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.25)); }
  .about-hero .words { display: flex; flex-direction: column; gap: 4px; }
  .about-hero .name { font-size: 24px; line-height: 32px; font-weight: 600; }
  .about-hero .line { font-size: 13px; line-height: 19px; color: var(--onSurfaceVariant); }
  .about-hero .line:empty { display: none; }
  .about-links { display: flex; flex-wrap: wrap; gap: 10px; }
  .link-button { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--primary); text-decoration: none; padding: 8px 14px; border-radius: 8px; background: color-mix(in srgb, var(--primary) 6%, transparent); border: 1px solid color-mix(in srgb, var(--primary) 25%, transparent); transition: background-color 150ms var(--ease); }
  .link-button:hover { background: color-mix(in srgb, var(--primary) 12%, transparent); }
  .about-credits { font-size: 12px; line-height: 18px; color: var(--onSurfaceVariant); }
  /* a pane's sections rise in, one after another, as it opens */
  .content.entering > section { animation: section-in 380ms var(--ease) backwards; animation-delay: calc(var(--i, 0) * 50ms); }
  @keyframes section-in { from { opacity: 0; transform: translateY(10px); } }
  /* what turns up in an open pane (Anki's cards once it's connected, a dictionary once it's in) */
  .appear { animation: appear 300ms var(--ease) backwards; }
  /* an open menu's section over the ones after it, which it overlaps */
  section:has(.dropdown) { position: relative; z-index: 5; }
  @keyframes appear { from { opacity: 0; transform: translateY(-4px); } }
  /* a theme changes over, rather than at once */
  body, .sidebar, .card, .select, .input { transition: background-color 300ms var(--ease), color 300ms var(--ease), border-color 300ms var(--ease); }
  .label { display: flex; align-items: baseline; padding: 0 0 10px 2px; }
  .label .text { flex: 1; font-size: 11px; line-height: 14px; letter-spacing: 1.4px; font-weight: 500; text-transform: uppercase; color: var(--onSurfaceVariant); }
  .label .note { font-size: 12px; line-height: 17px; color: color-mix(in srgb, var(--onSurfaceVariant) 80%, transparent); }
  .card { border-radius: 12px; background: var(--card); }
  .card > :first-child { border-top-left-radius: 12px; border-top-right-radius: 12px; }
  .card > :last-child { border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }
  .divider { height: 1px; background: var(--rowLine); }
  .below { font-size: 12px; line-height: 17px; color: var(--onSurfaceVariant); padding: 8px 0 0 2px; }
  .below.error { color: var(--error); }
  .below a { color: var(--primary); text-decoration: none; }
  .below a:hover { text-decoration: underline; }

  /* a row: what it is, a word on it, and the control at its end */
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
  .row .words { flex: 1; min-width: 0; }
  .row .title { font-size: 13px; line-height: 19px; }
  .row .title.strong { font-weight: 500; }
  .row .detail { font-size: 12px; line-height: 17px; color: var(--onSurfaceVariant); overflow-wrap: anywhere; }
  .row .detail.highlight { color: var(--primary); }
  .row .detail .keycap { margin: 0 2px; }
  .row .controls { display: flex; align-items: center; gap: 8px; flex: none; }
  .row.key { padding: 9px 14px; }
  .row > .site-logo { width: 18px; height: 18px; flex: none; object-fit: contain; }
  .row.dictionary { padding: 10px 14px; }
  .strip { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: color-mix(in srgb, var(--onSurface) 4%, transparent); }
  .strip .status { flex: 1; min-width: 0; font-size: 12px; line-height: 17px; color: var(--onSurfaceVariant); }
  /* how far along a download or an import is */
  .bar { width: 120px; height: 4px; flex: none; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--primary) 18%, transparent); }
  .bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--primary); transition: width 250ms var(--ease); }
  .bar.unknown i { width: 40%; animation: sweep 1.2s var(--ease) infinite; }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  /* words for something still on its way */
  .waiting { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.45; } }
  /* a row's shape while it loads */
  .row.skeleton { height: 58px; }
  .row.skeleton .words { display: flex; flex-direction: column; gap: 8px; }
  .bone { display: block; width: 46%; height: 9px; border-radius: 5px; background: linear-gradient(90deg, color-mix(in srgb, var(--onSurface) 7%, transparent) 30%, color-mix(in srgb, var(--onSurface) 13%, transparent) 50%, color-mix(in srgb, var(--onSurface) 7%, transparent) 70%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
  .bone.short { width: 28%; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) {
    .content.entering > section, .appear, .main > header .pane-title, .waiting, .bone, .bar.unknown i { animation: none; }
    .sidebar .pill { transition: none; }
  }


  .arrows { display: flex; flex-direction: column; }
  .arrows .text-action { width: 20px; padding: 0; font-size: 11px; line-height: 14px; font-weight: 500; color: color-mix(in srgb, var(--onSurfaceVariant) 70%, transparent); }

  /* the design's select, and the menu it opens */
  .select-box { position: relative; flex: none; }
  .select { display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 8px 5px 10px; border-radius: 8px; text-align: left; font-size: 12px; line-height: 17px; background: var(--control); border: 1px solid var(--controlLine); }
  .select .value { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .select.muted .value, .select .arrow { color: var(--onSurfaceVariant); }
  .dropdown {
    position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; min-width: 100%; max-height: 320px; overflow-y: auto;
    padding: 8px 0; border-radius: 4px; background: var(--surfaceVariant);
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2), 0 1px 3px rgba(0, 0, 0, 0.15);
    transform-origin: top; animation: open 120ms var(--ease);
  }
  @keyframes open { from { opacity: 0; transform: scaleY(0.8); } }
  .dropdown button { display: block; width: 100%; text-align: left; padding: 0 12px; height: 36px; white-space: nowrap; font-size: 13px; }
  .dropdown button:hover { background: color-mix(in srgb, var(--onSurface) 8%, transparent); }
  .input { font: inherit; font-size: 12px; line-height: 17px; color: var(--onSurface); padding: 5px 10px; border-radius: 8px; background: var(--control); border: 1px solid var(--controlLine); outline: none; }
  .input::placeholder { color: color-mix(in srgb, var(--onSurfaceVariant) 60%, transparent); }

  .row .detail .keycap { padding: 0 5px; min-width: 0; }
  /* one of an action's keys: waiting for a new one, it says so; hovered, an × on its corner takes it off */
  .key-button { position: relative; display: flex; padding: 2px; border-radius: 7px; border: 1px solid transparent; }
  .key-button:hover { border-color: var(--controlLine); }
  .key-button.recording { border-color: var(--primary); }
  .key-button .plain { min-width: 22px; padding: 3px 6px; text-align: center; white-space: nowrap; font-size: 11px; line-height: 14px; font-weight: 500; }
  .key-button.add .plain { color: color-mix(in srgb, var(--onSurfaceVariant) 50%, transparent); }
  .key-button.add:hover .plain { color: var(--onSurfaceVariant); }
  .key-button.recording .plain { color: var(--primary); }
  .key-button .remove { position: absolute; top: -6px; right: -6px; width: 15px; height: 15px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 10px; line-height: 10px; background: var(--onSurfaceVariant); color: var(--surface); }
  .key-button:hover:not(.recording) .remove { display: flex; }
  .keys { display: flex; gap: 6px; align-items: center; }
  .buttons { display: flex; gap: 8px; align-items: center; padding-top: 10px; }

  /* the subtitles' size, and how it looks over a picture */
  .size { display: flex; align-items: center; gap: 14px; padding: 10px 14px; }
  .size .name { width: 80px; }
  .size .a { color: var(--onSurfaceVariant); }
  .size .value { width: 44px; text-align: right; color: var(--onSurfaceVariant); }
  .slider { flex: 1; -webkit-appearance: none; appearance: none; height: 16px; margin: 0; background: none; --at: 50%; }
  .slider::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--primary) var(--at), color-mix(in srgb, var(--onSurfaceVariant) 25%, transparent) var(--at)); }
  .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -5.5px; border-radius: 50%; background: var(--primary); border: none; }
  .slider::-moz-range-track { height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--onSurfaceVariant) 25%, transparent); }
  .slider::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--primary); }
  .slider::-moz-range-thumb { width: 15px; height: 15px; border-radius: 50%; background: var(--primary); border: none; }
  /* the size as it'll look over a video, rather than as a number */
  .preview { margin: 0 14px 14px; height: 96px; border-radius: 7px; background: #16181C; border: 1px solid var(--hairline); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .preview span { color: #fff; white-space: nowrap; line-height: 1.2; padding-bottom: 14px; }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="head">Settings</div>
  <nav id="nav"></nav>
  <div class="grow"></div>
  <div class="foot"><button class="about" id="about" title="About Mizune"><img src="icons/128.png" alt=""><div><div class="name">Mizune</div><div class="version" id="version"></div></div></button></div>
</aside>
<div class="main">
  <header id="pane-name"></header>
  <div class="scroll"><div class="columns"><div class="content" id="content"></div></div></div>
</div>
<aside class="preview-pane"><header>Preview</header><div class="preview-scroll"><div class="preview-column" id="preview"></div></div></aside>
<input type="file" id="zip" accept=".zip" hidden>
<input type="file" id="key-file" accept=".json,application/json" hidden>
<script src="options.js"></script>
</body>
</html>
